<div class="modal-overlay">
  <div class="modal-backdrop" (click)="close.emit()"></div>

  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-title">
        <span class="material-symbols-outlined icon-primary">add_task</span>
        <h2>Créer une nouvelle tâche</h2>
      </div>
      <button type="button" class="btn-icon" aria-label="Fermer" (click)="close.emit()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <form [formGroup]="createTaskForm" (ngSubmit)="onSubmitNewTask()" class="modal-form">
      <div class="form-group">
        <label for="task-title">Titre de la tâche</label>
        <input
          id="task-title"
          type="text"
          placeholder="Ex: Maquetter la page de profil"
          formControlName="titleTask"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="task-desc">Description</label>
        <textarea
          id="task-desc"
          rows="3"
          placeholder="Détails ou instructions sur la tâche..."
          class="form-control"
          formControlName="description"
        ></textarea>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="task-priority">Priorité</label>
          <select id="task-priority" formControlName="priority" class="form-control">
            @for (priority of priorities; track priority.value) {
              <option [value]="priority.value">{{ priority.label }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="task-duedate">Date d'échéance</label>
          <input
            id="task-duedate"
            type="date"
            class="form-control"
            formControlName="dueDate"
          />
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="close.emit()">
          Annuler
        </button>
        <button type="submit" class="button-blue" [disabled]="createTaskForm.invalid">
          <span class="material-symbols-outlined">check</span>
          Créer la tâche
        </button>
      </div>
    </form>
  </div>
</div>
